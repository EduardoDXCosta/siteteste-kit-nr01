# Site de teste: todas as respostas levam X-Robots-Tag noindex (não indexar no Google)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        access_log off;
    }

    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # HTML nunca em cache longo: o navegador sempre revalida e pega a versão nova na hora.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow" always;
        expires off;
    }
    location = / {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow" always;
        expires off;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    error_page 404 /index.html;

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
